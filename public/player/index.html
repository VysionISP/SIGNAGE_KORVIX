<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Korvix Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body { font-family: system-ui, -apple-system, sans-serif; color: #fff; }
  /* #root is rotated as a whole when the physical panel is mounted sideways */
  #root { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #root.rot90  { width: 100vh; height: 100vw; transform: rotate(90deg) translateY(-100%); transform-origin: top left; }
  #root.rot180 { transform: rotate(180deg); }
  #root.rot270 { width: 100vh; height: 100vw; transform: rotate(270deg) translateX(-100%); transform-origin: top left; }
  .layer { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; }
  .layer.visible { opacity: 1; }
  .layer img, .layer video, .layer iframe { width: 100%; height: 100%; object-fit: cover; border: 0; display: block; }
  .layer .html-slide { width: 100%; height: 100%; }

  #pairing, #standby {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(ellipse at center, #12233a 0%, #060b14 75%);
  }
  #pairing .brand, #standby .brand { font-size: 2.2vw; letter-spacing: .5em; opacity: .6; margin-bottom: 2vh; }
  #pairing .code { font-size: 11vw; font-weight: 700; letter-spacing: .18em; margin: 2vh 0; font-variant-numeric: tabular-nums; }
  #pairing .hint, #standby .hint { font-size: 1.8vw; opacity: .7; max-width: 60%; line-height: 1.6; }

  #emergency {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; z-index: 100; padding: 4vw; box-sizing: border-box;
  }
  #emergency.evacuation { background: #b91c1c; animation: pulse 1.2s infinite alternate; }
  #emergency.lockdown { background: #7f1d1d; animation: pulse 1.2s infinite alternate; }
  #emergency.alert { background: #b45309; }
  #emergency.notice { background: #1d4ed8; }
  @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.35); } }
  #emergency .em-level { font-size: 3vw; letter-spacing: .4em; font-weight: 700; opacity: .9; }
  #emergency .em-title { font-size: 7vw; font-weight: 800; margin: 2vh 0; }
  #emergency .em-message { font-size: 3vw; line-height: 1.5; max-width: 80%; }

  #draw {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; z-index: 90;
    background: radial-gradient(ellipse at center, #3b0764 0%, #150425 75%);
    padding: 4vw; box-sizing: border-box; overflow: hidden;
  }
  #draw .rays {
    position: absolute; inset: -60%; z-index: 0; opacity: .14; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, rgba(251,191,36,.9) 0deg 7deg, transparent 7deg 26deg);
    animation: rayspin 24s linear infinite; transition: opacity .8s ease;
  }
  #draw.celebrate .rays { opacity: .32; }
  @keyframes rayspin { to { transform: rotate(360deg); } }
  #draw-confetti { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; }
  #draw .draw-name, #draw .draw-label, #draw-reels, #draw .draw-prev { position: relative; z-index: 2; }
  #draw .draw-name { font-size: 3.2vw; letter-spacing: .3em; font-weight: 700; opacity: .9; text-transform: uppercase; }
  #draw .draw-label { font-size: 2vw; letter-spacing: .5em; opacity: .6; margin: 3vh 0 1.5vh; }

  /* Slot-machine reels: one spinning digit column per digit of the result */
  #draw-reels { display: flex; gap: .07em; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #draw-reels .reel {
    height: 1.14em; overflow: hidden; border-radius: .1em; padding: .07em .05em;
    background: rgba(255,255,255,.07); border: .012em solid rgba(216,180,254,.35);
    box-shadow: inset 0 .04em .2em rgba(0,0,0,.6), 0 .02em .12em rgba(0,0,0,.4);
  }
  #draw-reels .strip { display: flex; flex-direction: column; will-change: transform; }
  #draw-reels .strip span { height: 1.14em; min-width: .68em; display: flex; align-items: center; justify-content: center; }
  #draw-reels .reel.spinning .strip { animation: reelspin .26s linear infinite; filter: blur(.03em); }
  @keyframes reelspin { from { transform: translateY(0); } to { transform: translateY(-11.4em); } }
  #draw-reels .reel.locked { animation: lockthump .45s ease; }
  @keyframes lockthump {
    0% { box-shadow: inset 0 .04em .2em rgba(0,0,0,.6), 0 0 .4em rgba(251,191,36,.9); transform: scale(1.06); }
    100% { box-shadow: inset 0 .04em .2em rgba(0,0,0,.6), 0 .02em .12em rgba(0,0,0,.4); transform: scale(1); }
  }
  #draw-reels.done .reel { border-color: rgba(251,191,36,.75); }
  #draw-reels.done .strip span { color: #fbbf24; text-shadow: 0 0 .35em rgba(251,191,36,.65); }
  #draw-reels.done { animation: winnerpop .7s cubic-bezier(.2,1.4,.4,1); }
  @keyframes winnerpop { 0% { transform: scale(1); } 45% { transform: scale(1.09); } 100% { transform: scale(1); } }

  #draw .draw-prev { font-size: 2vw; margin-top: 3.5vh; opacity: 0; transition: opacity .8s ease; }
  #draw .draw-prev.show { opacity: .7; }

  #cashking {
    position: absolute; inset: 0; display: none; flex-direction: column; z-index: 80;
    background: radial-gradient(ellipse at top, #14532d 0%, #052012 70%);
    padding: 2vh 2vw; box-sizing: border-box;
  }
  #ck-head { display: flex; align-items: baseline; gap: 2vw; margin-bottom: 1.5vh; }
  #ck-name { font-size: 3vw; font-weight: 800; letter-spacing: .12em; }
  #ck-jackpot { font-size: 4.2vw; font-weight: 800; color: #fbbf24; font-variant-numeric: tabular-nums; margin-left: auto; }
  #ck-sub { font-size: 1.6vw; opacity: .8; }
  #ck-board { flex: 1; display: grid; grid-template-columns: repeat(9, 1fr); gap: .6vw; align-content: stretch; }
  .ck-card {
    border-radius: .5vw; display: flex; align-items: center; justify-content: center;
    font-weight: 800; position: relative; min-height: 0;
  }
  .ck-card.down { background: linear-gradient(135deg, #1d4ed8, #172554); border: .12vw solid #3b82f6aa; color: #93c5fd; font-size: 1.5vw; }
  .ck-card.up { background: #f8fafc; color: #0f172a; font-size: 2vw; border: .12vw solid #cbd5e1; opacity: .55; }
  .ck-card.up.red { color: #dc2626; }
  .ck-card.up.joker { background: linear-gradient(135deg, #fbbf24, #b45309); color: #451a03; opacity: 1; }
  .ck-card.fresh { animation: ckflip .9s ease; opacity: 1; box-shadow: 0 0 2vw #fbbf24aa; z-index: 2; }
  @keyframes ckflip { 0% { transform: rotateY(90deg) scale(1.6); } 60% { transform: rotateY(0) scale(1.35); } 100% { transform: scale(1); } }
  #ck-banner { text-align: center; font-size: 2.2vw; min-height: 3.2vw; padding-top: 1vh; font-weight: 700; }
  #ck-won {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; background: radial-gradient(ellipse at center, #b45309 0%, #451a03 80%); z-index: 5;
  }
  #ck-won .t1 { font-size: 8vw; font-weight: 900; }
  #ck-won .t2 { font-size: 12vw; font-weight: 900; color: #fde68a; font-variant-numeric: tabular-nums; }
  #ck-won .t3 { font-size: 3vw; opacity: .9; }

  #status {
    position: absolute; right: 1vw; bottom: 1vh; z-index: 50;
    font-size: 12px; opacity: .35; font-variant-numeric: tabular-nums;
  }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 6px; }
  #status.disconnected .dot { background: #ef4444; }

  .widget { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4vw; box-sizing: border-box; }
  .widget .kicker { font-size: 2vw; letter-spacing: .4em; opacity: .75; }
  .widget h1 { font-size: 5.5vw; margin: .3em 0; }
  .widget .big { font-size: 9vw; font-weight: 800; font-variant-numeric: tabular-nums; }
  .widget table { border-collapse: collapse; font-size: 2.4vw; margin-top: 2vh; }
  .widget td { padding: .35em 1.2em; text-align: left; }
  .widget td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .widget .strike { text-decoration: line-through; opacity: .5; }
</style>
</head>
<body>
<div id="root">
  <div id="stage"></div>

  <div id="pairing">
    <div class="brand">KORVIX SIGNAGE</div>
    <div style="font-size:2.4vw;opacity:.85">Enter this code in the dashboard to pair this screen</div>
    <div class="code" id="pairing-code">------</div>
    <div class="hint">Dashboard &rarr; Screens &rarr; choose a screen &rarr; Pair device</div>
  </div>

  <div id="standby">
    <div class="brand">KORVIX SIGNAGE</div>
    <div style="font-size:3vw" id="standby-name">Screen paired</div>
    <div class="hint" id="standby-hint">No content scheduled for this screen right now.</div>
  </div>

  <div id="cashking">
    <div id="ck-head">
      <div id="ck-name"></div>
      <div id="ck-sub"></div>
      <div id="ck-jackpot"></div>
    </div>
    <div id="ck-board"></div>
    <div id="ck-banner"></div>
    <div id="ck-won">
      <div class="t1">🃏 JOKER FOUND!</div>
      <div class="t2" id="ck-won-amount"></div>
      <div class="t3" id="ck-won-sub"></div>
    </div>
  </div>

  <div id="draw">
    <div class="rays"></div>
    <canvas id="draw-confetti"></canvas>
    <div class="draw-name" id="draw-name"></div>
    <div class="draw-label">LUCKY NUMBER</div>
    <div id="draw-reels"></div>
    <div class="draw-prev" id="draw-prev"></div>
  </div>

  <div id="emergency">
    <div class="em-level" id="em-level"></div>
    <div class="em-title" id="em-title"></div>
    <div class="em-message" id="em-message"></div>
  </div>

  <div id="status"><span class="dot"></span><span id="status-text"></span></div>
</div>

<script src="player.js"></script>
</body>
</html>
